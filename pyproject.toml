[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-rdbms-rebuild"
version = "0.1.0"
description = "Educational mini relational database management system"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
minirdb = "mini_rdbms.main:main"
minirdb-web = "mini_rdbms.web:serve"

[tool.setuptools.packages.find]
where = ["src"]
